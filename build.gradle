plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id 'net.neoforged.gradle' version '[6.0.18,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

ext.early = true
apply from: 'project.gradle'

project.ext.package = project.ext.group + '.' + project.ext.projectName.toLowerCase()

if (project.ext.useElytraVersionFormat) {
    def branch
    if (System.env.BRANCH_NAME) {
        // Jenkins support
        branch = System.env.BRANCH_NAME
        branch = branch.substring(branch.lastIndexOf('/') + 1)
    } else {
        branch = 'git rev-parse --abbrev-ref HEAD'.execute().in.text.trim()
    }
    if (branch == "HEAD") {
        branch = 'git rev-parse --short HEAD'.execute().in.text.trim()
    }
    def commits = 'git rev-list --count HEAD'.execute().in.text.trim()
    def dirty = !'git diff-index HEAD'.execute().in.text.trim().isEmpty()
    version = branch + '-' + project.ext.version + '.' + commits + (dirty ? '-dirty' : '')
} else {
    version = project.ext.version
}

group = project.ext.group
archivesBaseName = project.ext.projectName

ext {
    compoundClassesDir = file('build/compound')
}

configurations {
    shade
}

repositories {
    maven { url = 'https://repo.tridevmc.com/' }
    // Embeddium and Oculus, only used to test rendering in the development client.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

minecraft {
    mappings channel: project.ext.mappingsChannel, version: project.ext.mappingsVersion

    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            // Remap the refmaps of mixin mods (Embeddium, Oculus) to development names.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            args '-mixin.config=apn.mixins.json'

            mods {
                mainMod {
                    source sourceSets.main
                }
            }
        }

        // Development client with Embeddium, Oculus and an automated test scene (see client/test/AutoTest).
        clientTest {
            parent runs.client
            taskName 'runClientTest'
            workingDirectory project.file('run')
            property 'apn.autotest', 'true'
            args '--quickPlaySingleplayer', 'APN Test'
        }

        server {
            workingDirectory project.file('run')
            args '-mixin.config=apn.mixins.json'

            // Recommended logging data for a userdev environment
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            property 'forge.logging.console.level', 'debug'

            mods {
                mainMod {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.neoforged:forge:${project.ext.forge}"
    // Only for runClientTest -PrenderTest, these are client only and would stop the dev server.
    if (project.hasProperty('renderTest')) {
        runtimeOnly fg.deobf("maven.modrinth:embeddium:0.3.31+mc1.20.1")
        runtimeOnly fg.deobf("maven.modrinth:oculus:1.20.1-1.8.0")
    }
}

jar {
    manifest {
        attributes 'MixinConfigs': 'apn.mixins.json'
    }
    finalizedBy('reobfJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '10000'
}

def needsShadow = !project.ext.compoundModules.isEmpty()

if (needsShadow) {
    dependencies {
        for (String module : project.ext.compoundModules) {
            def moduleIdentifier = 'com.tridevmc.compound:compound-' + module + ':' + project.ext.compoundVersion
            implementation(moduleIdentifier)
            shade(moduleIdentifier)
        }
    }

    tasks.build.dependsOn shadowJar

    artifacts {
        archives shadowJar
    }

    jar {
        archiveClassifier = 'slim'
    }

    shadowJar {
        configurations = [project.configurations.shade]
        relocate 'com.tridevmc.compound', project.ext.projectPackage + '.com.tridevmc.compound'
        finalizedBy 'reobfShadowJar'
    }

    assemble.dependsOn shadowJar

    reobf {
        shadowJar {}
    }
}

ext.early = false
apply from: 'project.gradle'

if (file('private.gradle').exists()) {
    apply plugin: 'maven-publish'
    apply from: 'private.gradle'
}
// The MIT licence requires the notices to ship with every copy of the mod.
tasks.named('jar') {
    from(rootProject.file('LICENSE'))
    from(rootProject.file('CREDITS.md'))
}
